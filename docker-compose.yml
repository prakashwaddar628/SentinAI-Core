version: "3.8"

services:
  backend:
    build: ./backend
    container_name: sentinai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/evidence:/app/evidence # Persist evidence images
      - ./backend/sentinai.db:/app/sentinai.db # Persist database
    restart: always

  frontend:
    build: ./frontend
    container_name: sentinai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - backend
    restart: always
